# The SIP stack of the web MVP, as a development and CI stack: OpenSIPS (registrar, WS and WSS, routing) and
# rtpengine (media), with a PostgreSQL that holds the OpenSIPS accounts (`subscriber`, written by the Gateway) and
# can hold the Gateway's own tables. Host network: the browsers of the machine reach rtpengine's RTP ports and
# OpenSIPS's sockets directly (ICE candidates are the host's address). Linux and Docker Desktop >= 4.34 (host
# networking enabled in its settings). Everything listens on the loopback only (LISTEN_IP, RTPENGINE_INTERFACE,
# PostgreSQL): a stack reachable from a network needs real certificates, credentials and rate limits first.
#
#   docker compose -f docker/docker-compose.sip.yml up --build --wait
#   OPENSIPS_WS_URL=wss://127.0.0.1:8089 SIP_DOMAIN=127.0.0.1 OPENSIPS_DB_URL=postgres://twake:twake@127.0.0.1:54320/twake ...
#
# Ports: 5060/udp SIP, 5070/udp the trunk to the operator (step 6; simulated by the e2e), 5090/udp the socket of
# LiveKit SIP (step 8), 8088 WS, 8089 WSS, 22222/udp rtpengine control, 22223/udp its DTMF report, 30000-30400/udp RTP
# (100 calls, each one held 30 s after its end), 54320 PostgreSQL.
#
# Meet's phone access (step 8, ADR 0018): a LiveKit server (7880 API, 7881/tcp and 7882/udp WebRTC), LiveKit SIP
# (5080 SIP, 31000-31100/udp RTP, 9082 health) and the Redis they share (6379), self-hosted here as in a deployment
# next to La Suite Meet. LiveKit SIP sees OpenSIPS only: calls to the access number (MEET_NUMBER, 8000) come from it,
# the rooms' calls go to it (5090) with the credentials below. The keys and the password are this stack's own, for
# development and CI only (as twake:twake for PostgreSQL); a deployment sets its own.
#
# The mailboxes (step 11a, ADR 0022): Wazo Platform 26.10, its official images, the services a mailbox needs only
# (below, before OpenSIPS); OpenSIPS sends it the calls nothing else takes, from its socket 5095, to its Asterisk (5100).
#
# The transcription of the messages and the bot (step 11b, ADR 0023): LinTO STT (its Kaldi engine, the smallest French
# model: docker/linto/Dockerfile), its HTTP API on 8090; a Matrix homeserver (Synapse, 8008) where the bot of
# TwakePhone tells each person of their messages, as in Twake Chat. Both on the loopback.
# The platform's identity in Wazo (step 11a, XIVO_UUID of each of its services): the one its database image was made with.
x-wazo-uuid: &wazo-uuid 50f01d62-b7e9-4485-8fb4-f47d46206def

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: twake
      POSTGRES_PASSWORD: twake
      POSTGRES_DB: twake
    # OpenSIPS takes up to DB_MAX_ASYNC_CONNECTIONS connections per SIP process (8 x 10) on top of its own and the
    # Gateway's: more than PostgreSQL's 100 by default (review 8b, n°5).
    command: ["postgres", "-p", "54320", "-c", "listen_addresses=127.0.0.1", "-c", "max_connections=200"]
    # OpenSIPS checks its `subscriber` table at startup: created with the database, filled by the Gateway.
    volumes:
      - ./opensips/subscriber.sql:/docker-entrypoint-initdb.d/01-subscriber.sql:ro
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twake -p 54320"]
      interval: 2s
      timeout: 3s
      retries: 30

  rtpengine:
    build: ./rtpengine
    environment:
      RTPENGINE_INTERFACE: ${RTPENGINE_INTERFACE:-127.0.0.1}
      RTPENGINE_LISTEN: 127.0.0.1:22222
      RTPENGINE_PORT_MIN: "30000"
      RTPENGINE_PORT_MAX: "30400"
      # Tones detected in the media, reported to the e2e (apps/web/test/sip.e2e.mjs) as JSON over UDP.
      RTPENGINE_DTMF_LOG: ${RTPENGINE_DTMF_LOG:-127.0.0.1:22223}
    network_mode: host
    healthcheck:
      # The CLI port (--listen-cli), not the NG control socket OpenSIPS uses.
      test: ["CMD-SHELL", "rtpengine-ctl -ip 127.0.0.1 -port 9900 list numsessions >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Shared by LiveKit and LiveKit SIP (their RPC and state), on the loopback, without persistence.
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--save", "", "--appendonly", "no"]
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  livekit:
    image: livekit/livekit-server:v1.13.7
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # The loopback only; its own candidate is offered to LiveKit SIP (a WebRTC client of the rooms on this host).
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["127.0.0.1"]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          enable_loopback_candidate: true
          node_ip: 127.0.0.1
        redis:
          address: 127.0.0.1:6379
        keys:
          ${LIVEKIT_API_KEY:-twake-dev}: ${LIVEKIT_API_SECRET:-twake-dev-only-livekit-secret-0123456789}
        # Its webhooks to the Gateway (second review 8b, n°3: a room ended, its owner gone from a conference), signed
        # with the Gateway's key: where the e2e listens (GATEWAY_PORT, 18080 by default), a Gateway of this host else.
        # The e2e stops at once when that port is taken; moved, both GATEWAY_PORT and LIVEKIT_WEBHOOK_URL change.
        webhook:
          api_key: ${LIVEKIT_API_KEY:-twake-dev}
          urls:
            - ${LIVEKIT_WEBHOOK_URL:-http://127.0.0.1:18080/api/v1/webhooks/livekit}
        # warn: at info, the server writes each CreateSIPDispatchRule whole, the PIN of the room in it (ADR 0018).
        logging:
          level: warn
    network_mode: host
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880"]
      interval: 2s
      timeout: 3s
      retries: 30

  livekit-sip:
    image: livekit/sip:v1.17.0
    depends_on:
      livekit:
        condition: service_healthy
    environment:
      # SIP on the loopback (5080), its SDP naming the loopback too: OpenSIPS and rtpengine are on this host.
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-twake-dev}
        api_secret: ${LIVEKIT_API_SECRET:-twake-dev-only-livekit-secret-0123456789}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
        sip_port: 5080
        listen_ip: 127.0.0.1
        use_external_ip: false
        nat_1_to_1_ip: 127.0.0.1
        rtp_port: 31000-31100
        health_port: 9082
        # info here, for the CI's log of a failed call: it writes the PIN typed (only the e2e's); warn anywhere else.
        logging:
          level: info
    network_mode: host
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5080"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Wazo Platform (step 11a, ADR 0022): the voicemail of the people of the platform, behind OpenSIPS, which sends it
  # the calls nobody takes (do not disturb, busy, no answer, nobody there) on a UDP socket of its own (WAZO_PORT,
  # 5095). Wazo's official images of release 26.10, pinned by digest (its database's only by digest: it has no other
  # tag), on the loopback, each on its port: Wazo's database (54330), its bus (RabbitMQ, 5672), wazo-auth (9497),
  # wazo-confd (9486), wazo-confgend (8669), Asterisk (5100/udp SIP, 5038 AMI, 5039 ARI, 32000-32100/udp RTP),
  # wazo-amid (9491), wazo-calld (9500), wazo-websocketd (9502), and two stand-ins of this stack: the accounts
  # wazo-auth-keys makes on a Wazo (wazo-bootstrap) and the part of wazo-sysconfd wazo-confd uses (8668). Nothing
  # listens off the loopback (docker/wazo/check-loopback.py, a step of the CI). Passwords and keys are
  # this stack's own, never Wazo's nor RabbitMQ's public defaults (the database's, ARI's, the bus's guest), for
  # development and CI only (as twake:twake for PostgreSQL).
  # Their healthchecks run every 2 s while they start (start_interval, Docker Engine 25 or later: an older one ignores
  # it and checks every minute only, the stack then taking minutes to start), then every minute: run every 2 s, they
  # kept a CPU of the CI's runner busy, which the browsers and LiveKit SIP (it refuses calls on a loaded machine) need.
  # Its image has no other tag than latest, which moves: the digest is what is used, the tag only
  # says which repository. Its account's password is Wazo's public default (proformatique): the healthcheck sets this
  # stack's own before it says healthy, so before any service of Wazo connects (a database kept by a restart has it).
  wazo-db:
    image: wazoplatform/wazo-confd-db:latest@sha256:76b5e45d790496c338ae4ec4a69cfbb7a0e1fe6cf4bf9e522c73409f517a1243
    command: ["-p", "54330", "-c", "listen_addresses=127.0.0.1"]
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -p 54330 -U asterisk && { PGPASSWORD=twake-wazo-dev-only-db psql -h 127.0.0.1 -p 54330 -U asterisk -d asterisk -qAtc 'SELECT 1' >/dev/null 2>&1 || PGPASSWORD=proformatique psql -h 127.0.0.1 -p 54330 -U asterisk -d asterisk -qAtc \"ALTER ROLE asterisk PASSWORD 'twake-wazo-dev-only-db'\" >/dev/null; }"]
      interval: 60s
      start_period: 5m
      start_interval: 2s
      timeout: 3s
      retries: 3

  # Wazo's bus, the loopback only (AMQP, Erlang's port mapper and distribution port, the metrics of its Prometheus
  # plugin). Its node is named after localhost, not the machine: where the machine's name resolves off the loopback
  # (a CI runner), the port mapper would be looked for there, and RabbitMQ would not start.
  # RabbitMQ 4.3 (maintained), pinned by digest; its account is this stack's, not guest.
  rabbitmq:
    image: rabbitmq:4.3.6-alpine@sha256:6931816af1a943f471c038b278835d36692d55dec769232739296bb91b7de0f5
    environment:
      RABBITMQ_DEFAULT_USER: wazo
      RABBITMQ_DEFAULT_PASS: twake-wazo-dev-only-bus
      RABBITMQ_NODENAME: rabbit@localhost
      RABBITMQ_NODE_IP_ADDRESS: 127.0.0.1
      ERL_EPMD_ADDRESS: 127.0.0.1
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-kernel inet_dist_use_interface {127,0,0,1} -rabbitmq_prometheus tcp_config [{ip,{127,0,0,1}},{port,15692}]"
    network_mode: host
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 60s
      start_period: 5m
      start_interval: 2s
      timeout: 10s
      retries: 3

  wazo-auth:
    image: wazoplatform/wazo-auth:wazo-26.10@sha256:eafaa41b1839feed8f6f9cf1be69c847d06ee0bf0481d467a6045cf13a4de3a0
    environment:
      XIVO_UUID: *wazo-uuid
    depends_on:
      wazo-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["wazo-auth", "--db-upgrade-on-startup"]
    volumes:
      - ./wazo/config/wazo-auth.yml:/etc/wazo-auth/conf.d/50-twakephone.yml:ro
      - ./wazo/healthcheck.py:/twake/healthcheck.py:ro
    network_mode: host
    healthcheck:
      test: ["CMD", "python3", "/twake/healthcheck.py", "http://127.0.0.1:9497/0.1/backends"]
      interval: 60s
      start_period: 5m
      start_interval: 2s
      timeout: 3s
      retries: 3

  wazo-bootstrap:
    image: wazoplatform/wazo-auth:wazo-26.10@sha256:eafaa41b1839feed8f6f9cf1be69c847d06ee0bf0481d467a6045cf13a4de3a0
    depends_on:
      wazo-auth:
        condition: service_healthy
    entrypoint: ["python3", "-u", "/twake/bootstrap.py"]
    environment:
      XIVO_UUID: *wazo-uuid
      WAZO_BOOTSTRAP_USER: twake-bootstrap
      WAZO_BOOTSTRAP_PASSWORD: twake-wazo-dev-only
      # The account of the Gateway (provider-wazo), in Wazo's tenant of the platform.
      WAZO_TWAKEPHONE_USER: ${WAZO_USER:-twakephone}
      WAZO_TWAKEPHONE_PASSWORD: ${WAZO_PASSWORD:-twake-wazo-dev-only-gateway}
    volumes:
      - ./wazo/bootstrap.py:/twake/bootstrap.py:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys
    network_mode: host
    healthcheck:
      test: ["CMD", "test", "-f", "/var/lib/wazo-auth-keys/.ready"]
      interval: 60s
      start_period: 5m
      start_interval: 2s
      timeout: 3s
      retries: 3

  wazo-confd:
    image: wazoplatform/wazo-confd:wazo-26.10@sha256:88af7c18e792d46f0c8ec484639f0d815aaf5f5d9ce848e2e95ec84e6851aa17
    environment:
      XIVO_UUID: *wazo-uuid
    depends_on:
      wazo-bootstrap:
        condition: service_healthy
    volumes:
      - ./wazo/config/wazo-confd.yml:/etc/wazo-confd/conf.d/50-twakephone.yml:ro
      - ./wazo/config/xivo-dao.yml:/etc/xivo-dao/conf.d/50-twakephone.yml:ro
      - ./wazo/healthcheck.py:/twake/healthcheck.py:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:ro
    network_mode: host
    healthcheck:
      test: ["CMD", "python3", "/twake/healthcheck.py", "tcp:127.0.0.1:9486"]
      interval: 60s
      start_period: 5m
      start_interval: 2s
      timeout: 3s
      retries: 3

  wazo-confgend:
    image: wazoplatform/wazo-confgend:wazo-26.10@sha256:d0e3544fdbe5d0c30a3d862dadd6cfedb525a105c8cfda4d14a3c58b9cb0d4fc
    environment:
      XIVO_UUID: *wazo-uuid
    depends_on:
      wazo-db:
        condition: service_healthy
    volumes:
      - ./wazo/config/wazo-confgend.yml:/etc/wazo-confgend/conf.d/50-twakephone.yml:ro
      - ./wazo/healthcheck.py:/twake/healthcheck.py:ro
    network_mode: host
    healthcheck:
      test: ["CMD", "python3", "/twake/healthcheck.py", "tcp:127.0.0.1:8669"]
      interval: 60s
      start_period: 5m
      start_interval: 2s
      timeout: 3s
      retries: 3

  wazo-asterisk:
    image: wazoplatform/asterisk:wazo-26.10@sha256:dd39add1852b5115cff318cf0ec25e1d2052d67c30f1e30827721a3b335ffb2d
    depends_on:
      wazo-confgend:
        condition: service_healthy
    entrypoint: ["/twake/entrypoint.sh"]
    environment:
      XIVO_UUID: *wazo-uuid
      WAZO_SIP_LISTEN: 127.0.0.1:5100
      # OpenSIPS's socket for Wazo (its WAZO_LISTEN_IP and WAZO_PORT, below): the only party Asterisk takes calls from.
      WAZO_OPENSIPS: 127.0.0.1:5095
      WAZO_RTP_ADDRESS: 127.0.0.1
      WAZO_RTP_MIN: "32000"
      WAZO_RTP_MAX: "32100"
      # This stack's own passwords: the ARI account of wazo-calld and wazo-confd, the database's (set by wazo-db's healthcheck).
      WAZO_ARI_PASSWORD: twake-wazo-dev-only-ari
      WAZO_DB_PASSWORD: twake-wazo-dev-only-db
      # The AMI account of wazo-sysconfd below (module reloads and the list of the mailboxes only, no event).
      WAZO_SYSCONFD_AMI_PASSWORD: twake-wazo-dev-only-sysconfd
      # The longest a call to a mailbox lasts, as OpenSIPS bounds it.
      VOICEMAIL_MAX_CALL_SEC: ${VOICEMAIL_MAX_CALL_SEC:-300}
    volumes:
      - ./wazo/asterisk/entrypoint.sh:/twake/entrypoint.sh:ro
      - ./wazo/asterisk/extensions.conf:/etc/asterisk/extensions.d/01-wazo.conf:ro
      # The prompts a mailbox plays, in French, made for this stack (docker/wazo/asterisk/sounds/README.md): the image
      # has none, Wazo's packages bring them on a Wazo.
      - ./wazo/asterisk/sounds:/usr/share/asterisk/sounds/fr_FR:ro
      - wazo-voicemail:/var/spool/asterisk/voicemail
    network_mode: host
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core waitfullybooted"]
      interval: 60s
      start_period: 5m
      start_interval: 2s
      timeout: 5s
      retries: 3

  wazo-sysconfd:
    image: wazoplatform/wazo-calld:wazo-26.10@sha256:b7d9f603949572c3e6c398adbdb0361f33b30d6ea41b58aceaaaa7dc0c7c4000
    depends_on:
      wazo-asterisk:
        condition: service_healthy
    entrypoint: ["python3", "-u", "/twake/sysconfd.py"]
    environment:
      XIVO_UUID: *wazo-uuid
      SYSCONFD_LISTEN: 127.0.0.1:8668
      SYSCONFD_AMI: 127.0.0.1:5038
      # Its own AMI account (wazo-asterisk's WAZO_SYSCONFD_AMI_PASSWORD), not wazo-amid's.
      SYSCONFD_AMI_USER: twake_sysconfd
      SYSCONFD_AMI_PASSWORD: twake-wazo-dev-only-sysconfd
      # Where it reads the mailboxes a voicemail reload must give Asterisk.
      SYSCONFD_CONFGEND: 127.0.0.1:8669
    volumes:
      - ./wazo/sysconfd.py:/twake/sysconfd.py:ro
      - ./wazo/healthcheck.py:/twake/healthcheck.py:ro
      - wazo-voicemail:/var/spool/asterisk/voicemail
    network_mode: host
    healthcheck:
      test: ["CMD", "python3", "/twake/healthcheck.py", "http://127.0.0.1:8668/status-check"]
      interval: 60s
      start_period: 5m
      start_interval: 2s
      timeout: 3s
      retries: 3

  wazo-amid:
    image: wazoplatform/wazo-amid:wazo-26.10@sha256:0101380b19e712d9ac06f91720dc5131d6d3f9adb0072b3e59aa959918979ee0
    environment:
      XIVO_UUID: *wazo-uuid
    depends_on:
      wazo-asterisk:
        condition: service_healthy
      wazo-bootstrap:
        condition: service_healthy
    volumes:
      - ./wazo/config/wazo-amid.yml:/etc/wazo-amid/conf.d/50-twakephone.yml:ro
      - ./wazo/healthcheck.py:/twake/healthcheck.py:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:ro
    network_mode: host
    healthcheck:
      test: ["CMD", "python3", "/twake/healthcheck.py", "tcp:127.0.0.1:9491"]
      interval: 60s
      start_period: 5m
      start_interval: 2s
      timeout: 3s
      retries: 3

  wazo-calld:
    image: wazoplatform/wazo-calld:wazo-26.10@sha256:b7d9f603949572c3e6c398adbdb0361f33b30d6ea41b58aceaaaa7dc0c7c4000
    environment:
      XIVO_UUID: *wazo-uuid
    depends_on:
      wazo-amid:
        condition: service_healthy
      wazo-confd:
        condition: service_healthy
    volumes:
      - ./wazo/config/wazo-calld.yml:/etc/wazo-calld/conf.d/50-twakephone.yml:ro
      - ./wazo/healthcheck.py:/twake/healthcheck.py:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:ro
      - wazo-voicemail:/var/spool/asterisk/voicemail
    network_mode: host
    healthcheck:
      test: ["CMD", "python3", "/twake/healthcheck.py", "tcp:127.0.0.1:9500"]
      interval: 60s
      start_period: 5m
      start_interval: 2s
      timeout: 3s
      retries: 3

  wazo-websocketd:
    image: wazoplatform/wazo-websocketd:wazo-26.10@sha256:2f652d120bff8829f7be1407d06280981198d04c97160eb76b1240645935c718
    environment:
      XIVO_UUID: *wazo-uuid
    depends_on:
      wazo-bootstrap:
        condition: service_healthy
    volumes:
      - ./wazo/config/wazo-websocketd.yml:/etc/wazo-websocketd/conf.d/50-twakephone.yml:ro
      - ./wazo/healthcheck.py:/twake/healthcheck.py:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:ro
    network_mode: host
    healthcheck:
      test: ["CMD", "python3", "/twake/healthcheck.py", "tcp:127.0.0.1:9502"]
      interval: 60s
      start_period: 5m
      start_interval: 2s
      timeout: 3s
      retries: 3

  # Step 11b (ADR 0023): LinTO STT, its HTTP API (POST /transcribe) on the loopback, the Gateway's LINTO_URL
  # (http://127.0.0.1:8090). A message of a few seconds is transcribed in a second or two.
  linto-stt:
    build: ./linto
    network_mode: host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthcheck', timeout=3)"]
      interval: 60s
      start_period: 3m
      start_interval: 2s
      timeout: 5s
      retries: 3

  # Step 11b: the Matrix homeserver of the bot's notices (docker/synapse/homeserver.yaml), its client-server API on the
  # loopback (http://127.0.0.1:8008), no federation. Its keys are made at its first start, in its volume.
  synapse:
    image: matrixdotorg/synapse:v1.163.0@sha256:e98ab72138d90fa8b8876c6421fe78a9fdb181c0d7cc690ad740e5173e0c65e6
    entrypoint: ["/bin/sh", "-c", "python -m synapse.app.homeserver --config-path /config/homeserver.yaml --generate-keys && exec python -m synapse.app.homeserver --config-path /config/homeserver.yaml"]
    volumes:
      - ./synapse/homeserver.yaml:/config/homeserver.yaml:ro
      - ./synapse/log.config:/config/log.config:ro
      - synapse-data:/data
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8008/health"]
      interval: 60s
      start_period: 3m
      start_interval: 2s
      timeout: 5s
      retries: 3

  opensips:
    build: ./opensips
    depends_on:
      postgres:
        condition: service_healthy
      rtpengine:
        condition: service_healthy
    environment:
      SIP_DOMAIN: ${SIP_DOMAIN:-127.0.0.1}
      LISTEN_IP: ${LISTEN_IP:-127.0.0.1}
      # The MI (no authentication) stays on the loopback whatever LISTEN_IP is: the Gateway runs on this host.
      MI_LISTEN_IP: ${MI_LISTEN_IP:-127.0.0.1}
      OPENSIPS_DB_URL: postgres://twake:twake@127.0.0.1:54320/twake
      RTPENGINE_SOCK: udp:127.0.0.1:22222
      OPENSIPS_LOG_LEVEL: ${OPENSIPS_LOG_LEVEL:-2}
      # How long a call to someone without a window waits for the browser a notification wakes (5 to 120 s, ADR 0015).
      PUSH_WAIT_SEC: ${PUSH_WAIT_SEC:-30}
      # The socket of the trunk to the operator (step 6, ADR 0016), apart from the phones' one: on the loopback here.
      TRUNK_LISTEN_IP: ${TRUNK_LISTEN_IP:-127.0.0.1}
      TRUNK_PORT: ${TRUNK_PORT:-5070}
      # The address announced to the operator on that socket (host[:port]) when a NAT stands in between: the
      # registration's binding, the Via and the Record-Route. The CI sets a TEST-NET one (192.0.2.10:5070) that the
      # simulated operator maps back to the socket. Empty: the socket's own address.
      TRUNK_ADVERTISE: ${TRUNK_ADVERTISE:-}
      # A call with the operator ends by itself after this long (seconds, 60 to 86400), a BYE to both sides; an
      # emergency call excepted.
      TRUNK_MAX_CALL_SEC: ${TRUNK_MAX_CALL_SEC:-14400}
      # The shortest call the minutes left of a cap allow (seconds, 1 to 600): less left, the call is refused.
      TRUNK_MIN_CALL_SEC: ${TRUNK_MIN_CALL_SEC:-60}
      # Every this long (seconds, 5 to 300), the phone in a call with the operator is sent an OPTIONS in the call: one
      # that does not answer it any more (its page closed, put to sleep, its network gone) has the call ended.
      CALL_PING_SEC: ${CALL_PING_SEC:-30}
      # How long that OPTIONS waits for its answer (seconds, 5 to 60): the first one unanswered ends the call.
      CALL_PING_TIMEOUT_SEC: ${CALL_PING_TIMEOUT_SEC:-15}
      # LiveKit SIP (step 8, ADR 0018): its address (empty: Meet off), OpenSIPS's socket for it, the access number of
      # the rooms, and the account its calls answer the challenge with (the Gateway gives LiveKit the same).
      MEET_SIP: ${MEET_SIP-127.0.0.1:5080}
      MEET_LISTEN_IP: ${MEET_LISTEN_IP:-127.0.0.1}
      MEET_PORT: ${MEET_PORT:-5090}
      MEET_NUMBER: ${MEET_NUMBER:-8000}
      MEET_SIP_USER: ${MEET_SIP_USER:-livekit}
      MEET_SIP_PASSWORD: ${MEET_SIP_PASSWORD:-twake-meet-dev-only}
      # The tries of a PIN (each call to MEET_NUMBER LiveKit SIP answers) after which a caller is refused for 10
      # minutes, those of all callers that tell the administrators, the calls to MEET_NUMBER at the same time of one
      # caller and of all, and the longest a call with LiveKit SIP lasts.
      MEET_PIN_TRIES: ${MEET_PIN_TRIES:-10}
      MEET_PIN_TRIES_ALL: ${MEET_PIN_TRIES_ALL:-300}
      MEET_CALLS_PER_CALLER: ${MEET_CALLS_PER_CALLER:-2}
      MEET_CALLS_ALL: ${MEET_CALLS_ALL:-100}
      MEET_MAX_CALL_SEC: ${MEET_MAX_CALL_SEC:-7200}
      # The database connections of each SIP process for its asynchronous reads (1 to 32): PostgreSQL's max_connections
      # must hold ten times as many and more (above). trunk.sip.mjs lowers it a moment to play what happens past them.
      DB_MAX_ASYNC_CONNECTIONS: ${DB_MAX_ASYNC_CONNECTIONS:-8}
      # Wazo's Asterisk (step 11a, ADR 0022): its address (empty: no mailboxes), and OpenSIPS's socket for it, the only
      # party it takes calls from (its WAZO_OPENSIPS).
      WAZO_SIP: ${WAZO_SIP-127.0.0.1:5100}
      WAZO_LISTEN_IP: ${WAZO_LISTEN_IP:-127.0.0.1}
      WAZO_PORT: ${WAZO_PORT:-5095}
      # The longest a call to a mailbox lasts; Asterisk bounds it too.
      VOICEMAIL_MAX_CALL_SEC: ${VOICEMAIL_MAX_CALL_SEC:-300}
      # The calls to the mailboxes at once per caller, of those with no number at a mailbox and at all of them, and for
      # all, and per hour of a caller to one mailbox. VOICEMAIL_CALLS_HIDDEN_ALL empty: entrypoint.sh takes a third of
      # VOICEMAIL_CALLS_ALL.
      VOICEMAIL_CALLS_PER_CALLER: ${VOICEMAIL_CALLS_PER_CALLER:-2}
      VOICEMAIL_CALLS_HIDDEN: ${VOICEMAIL_CALLS_HIDDEN:-5}
      VOICEMAIL_CALLS_HIDDEN_ALL: ${VOICEMAIL_CALLS_HIDDEN_ALL:-}
      VOICEMAIL_CALLS_ALL: ${VOICEMAIL_CALLS_ALL:-30}
      VOICEMAIL_CALLS_PER_HOUR: ${VOICEMAIL_CALLS_PER_HOUR:-10}
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "test -p /tmp/opensips_fifo"]
      interval: 2s
      timeout: 3s
      retries: 30

# Wazo (step 11a): the keys of its services, made by wazo-bootstrap; the mailboxes, shared by Asterisk, wazo-calld and
# wazo-sysconfd. Synapse's (step 11b): its keys, its database, the rooms and messages of the bot. All go with `down -v`.
volumes:
  wazo-auth-keys:
  wazo-voicemail:
  synapse-data:
