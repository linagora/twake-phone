# TwakePhone pilot: the whole web MVP on one Linux machine with a public address, for a real test by a few people.
# Caddy (HTTPS on one domain), the app, the Gateway, OpenSIPS + rtpengine, PostgreSQL; with `--profile demo`, a
# Keycloak and an OpenLDAP with three test people. Read docker/pilot/README.md first; `./init.sh` writes the .env.
#
#   ./init.sh phone.example.org you@example.org --demo      (without --demo: your own SSO and LDAP, see .env)
#   docker compose up -d --build --wait --wait-timeout 600   (.env says COMPOSE_PROFILES=demo with --demo)
#
# Public ports: 80/tcp and 443/tcp (Caddy), and the RTP range 30000-30999/udp (rtpengine). Everything else listens on
# the loopback: host networking for the services that talk to each other and to the browsers' media, loopback port
# mappings for the demo ones.
name: twakephone

x-logging: &logging
  logging:
    options:
      max-size: 10m
      max-file: "3"

x-host: &host
  network_mode: host
  restart: unless-stopped
  <<: *logging

services:
  caddy:
    <<: *host
    image: caddy:2.10
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN is required (./init.sh writes it)}"
      TLS: "${TLS:?TLS is required, an email for Let's Encrypt or the word internal}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Started with the others, not after them: a service that never gets healthy must not leave 443 silent.
    depends_on:
      - web
      - gateway

  postgres:
    <<: *host
    image: postgres:16
    environment:
      POSTGRES_USER: twake
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: twake
      # The image trusts the loopback by default: on the host network that is every process of the machine.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    # OpenSIPS takes up to DB_MAX_ASYNC_CONNECTIONS connections per SIP process (8 x 10 by default) on top of its own and
    # the Gateway's: more than PostgreSQL's 100 by default.
    command: ["postgres", "-p", "54320", "-c", "listen_addresses=127.0.0.1", "-c", "max_connections=200"]
    volumes:
      - ../opensips/subscriber.sql:/docker-entrypoint-initdb.d/01-subscriber.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twake -h 127.0.0.1 -p 54320"]
      interval: 2s
      timeout: 3s
      retries: 30

  rtpengine:
    <<: *host
    build: ../rtpengine
    image: twakephone-rtpengine:local
    environment:
      # The address written in the SDP, which the browsers send their media to: the machine's public address, or
      # "<private>!<public>" when the machine only has a private one behind a 1:1 NAT (most cloud providers).
      RTPENGINE_INTERFACE: "${RTPENGINE_INTERFACE:?RTPENGINE_INTERFACE is required (the public IP or private!public)}"
      RTPENGINE_LISTEN: 127.0.0.1:22222
      # About 4 ports a call to the public network (2 for the browser, 2 for the operator), each kept 30 s after its end:
      # some 200 calls at once. rtpengine reserves none for the emergency calls: the organisation's cap of calls to the
      # public network at the same time (20 by default, ADR 0017) keeps the room they need.
      RTPENGINE_PORT_MIN: "30000"
      RTPENGINE_PORT_MAX: "30999"
    healthcheck:
      test: ["CMD-SHELL", "rtpengine-ctl -ip 127.0.0.1 -port 9900 list numsessions >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 15

  opensips:
    <<: *host
    build: ../opensips
    image: twakephone-opensips:local
    depends_on:
      postgres:
        condition: service_healthy
      rtpengine:
        condition: service_healthy
    environment:
      # The SIP domain is the public name: realm of the digest hashes, host of Via and Record-Route. The browsers
      # reach OpenSIPS's WebSocket (loopback, port 8088) through Caddy at wss://DOMAIN/sip.
      SIP_DOMAIN: ${DOMAIN}
      LISTEN_IP: 127.0.0.1
      OPENSIPS_DB_URL: postgres://twake:${POSTGRES_PASSWORD}@127.0.0.1:54320/twake
      RTPENGINE_SOCK: udp:127.0.0.1:22222
      OPENSIPS_LOG_LEVEL: ${OPENSIPS_LOG_LEVEL:-2}
      # How long a call to someone without a window of the app waits for the browser the notification wakes (ADR 0015).
      PUSH_WAIT_SEC: ${PUSH_WAIT_SEC:-30}
      # The socket the operator's trunk talks to (step 6a, ADR 0016; README, "Relier un opérateur"): loopback until
      # TRUNK_LISTEN_IP names an address of this machine; TRUNK_ADVERTISE (host[:port]) only when the operator must be
      # told another address than the one its packets come from.
      TRUNK_LISTEN_IP: ${TRUNK_LISTEN_IP:-127.0.0.1}
      TRUNK_PORT: ${TRUNK_PORT:-5070}
      TRUNK_ADVERTISE:
      # A call with the operator ends by itself after this long (seconds, 60 to 86400; 4 hours by default), an
      # emergency call excepted.
      TRUNK_MAX_CALL_SEC:
      # The shortest call the minutes left of a cap allow (seconds, 1 to 600, 60 by default): less left, it is refused.
      TRUNK_MIN_CALL_SEC:
      # How often the phone in a call with the operator is asked whether it is still there (an OPTIONS in the call;
      # seconds, 5 to 300, 30 by default): one that no longer answers has the call ended. Never an emergency call.
      CALL_PING_SEC:
      # How long that OPTIONS waits for its answer (seconds, 5 to 60, 15 by default): the first one unanswered ends the
      # call, so a phone gone is noticed within CALL_PING_SEC + CALL_PING_TIMEOUT_SEC.
      CALL_PING_TIMEOUT_SEC:
      # Meet's phone access (step 8, ADR 0018; README, "Meet par téléphone"): off unless MEET_SIP names LiveKit SIP
      # (ip:port). OpenSIPS's socket for it stays on the loopback (MEET_LISTEN_IP, MEET_PORT 5090) and hears only it.
      MEET_SIP:
      MEET_LISTEN_IP:
      MEET_PORT:
      MEET_NUMBER:
      MEET_SIP_USER:
      MEET_SIP_PASSWORD:
      # The tries of a PIN (each call to MEET_NUMBER LiveKit SIP answers) after which a caller is refused for 10
      # minutes (10 by default), those of all callers in 10 minutes that tell the administrators (300), the calls to
      # MEET_NUMBER at the same time of one caller (2) and of all (100, refused past it), and the longest a call with
      # LiveKit SIP lasts (7200 s by default).
      MEET_PIN_TRIES:
      MEET_PIN_TRIES_ALL:
      MEET_CALLS_PER_CALLER:
      MEET_CALLS_ALL:
      MEET_MAX_CALL_SEC:
      # The database connections of each SIP process for its asynchronous reads (8 by default, 1 to 32): PostgreSQL's
      # max_connections (above) must hold ten times as many, with the Gateway's.
      DB_MAX_ASYNC_CONNECTIONS:
    healthcheck:
      # One MI request over UDP (mi_datagram, loopback): healthy once OpenSIPS answers, not once its fifo exists.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/udp/127.0.0.1/8880 && printf '{\"jsonrpc\":\"2.0\",\"method\":\"version\",\"id\":\"health\"}' >&3 && read -r -t 2 -n 1 _ <&3"]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    <<: *host
    build:
      context: ../..
      dockerfile: docker/Dockerfile.gateway
    image: twakephone-gateway:local
    depends_on:
      postgres:
        condition: service_healthy
      opensips:
        condition: service_healthy
      # Demo profile only: the first directory sync waits for the test people.
      openldap:
        condition: service_healthy
        required: false
    environment:
      HOST: 127.0.0.1
      PORT: "8080"
      DATABASE_URL: postgres://twake:${POSTGRES_PASSWORD}@127.0.0.1:54320/twake
      SECRETS_KEY: "${SECRETS_KEY:?SECRETS_KEY is required (64 hex characters, openssl rand -hex 32)}"
      # Who is calling: the access token of your SSO, a JWT whose audience is the Gateway (README, "Identité").
      AUTH_MODE: jwt
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_JWKS_URL: "${JWT_JWKS_URL:?JWT_JWKS_URL is required}"
      JWT_AUDIENCE: ${JWT_AUDIENCE:-twakephone-gateway}
      JWT_USER_CLAIM:
      JWT_ROLES_CLAIM:
      ADMIN_ROLE:
      ADMIN_USERS:
      HSTS_MAX_AGE:
      # The SIP server, created once in the database at the first start (the administration screen shows it).
      OPENSIPS_WS_URL: wss://${DOMAIN}/sip
      SIP_DOMAIN: ${DOMAIN}
      OPENSIPS_MI_URL: udp:127.0.0.1:8880
      # Who has which extension: the LDAP attribute LDAP_ATTR_EXTENSION, or USER_EXTENSIONS ("alice:101,bob:102",
      # read at each start, never over an extension already given).
      DEV_USER_MAP: ${USER_EXTENSIONS:-}
      LDAP_URL:
      LDAP_BASE_DN:
      LDAP_BIND_DN:
      LDAP_BIND_PASSWORD:
      LDAP_USER_FILTER:
      LDAP_ATTR_ID:
      LDAP_ATTR_EXTENSION:
      LDAP_SYNC_INTERVAL:
      # Notifications of calls while no window is open (Web Push, ADR 0015): the VAPID keys are made at the first start
      # and kept in the database, encrypted with SECRETS_KEY. The push services are told whom to reach: the site.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://${DOMAIN}}
      PUSH_PROXY:
      # The trunk to the operator (step 6a, ADR 0016): OpenSIPS's trunk socket, and a first trunk with its direct
      # numbers, written once when there is none (the administration API changes them afterwards). README, "Relier un
      # opérateur".
      OPENSIPS_TRUNK_SOCKET: udp:${TRUNK_LISTEN_IP:-127.0.0.1}:${TRUNK_PORT:-5070}
      # The address OpenSIPS announces there (its TRUNK_ADVERTISE): what a trunk registers as its binding.
      OPENSIPS_TRUNK_ADVERTISE: ${TRUNK_ADVERTISE:-}
      TRUNK_ID:
      TRUNK_NAME:
      TRUNK_AUTH:
      TRUNK_DOMAIN:
      TRUNK_PROXIES:
      TRUNK_SOURCES:
      TRUNK_USERNAME:
      TRUNK_PASSWORD:
      TRUNK_REALM:
      TRUNK_REGISTRAR:
      TRUNK_EXPIRES:
      TRUNK_CODECS:
      TRUNK_NUMBER_FORMAT:
      TRUNK_ASSERT_IDENTITY:
      TRUNK_DEFAULT_NUMBER:
      TRUNK_ALLOWED:
      TRUNK_COUNTRIES:
      TRUNK_DIDS:
      TRUNK_FALLBACK_TARGET:
      # Meet's phone access (step 8, ADR 0018): on once the LiveKit server's API and keys are given, with OpenSIPS's
      # address for LiveKit SIP's inbound trunk and OpenSIPS's socket for its calls (README, "Meet par téléphone").
      LIVEKIT_URL:
      LIVEKIT_API_KEY:
      LIVEKIT_API_SECRET:
      # The key LiveKit signs its webhooks with, when it is not the one above (Meet's: one key for all its webhook.urls).
      LIVEKIT_WEBHOOK_API_KEY:
      LIVEKIT_WEBHOOK_API_SECRET:
      MEET_NUMBER:
      MEET_DIALIN_NUMBERS:
      MEET_INBOUND_ADDRESSES:
      MEET_OUTBOUND_ADDRESS:
      MEET_SIP_USER:
      MEET_SIP_PASSWORD:
      MEET_MAX_CALL_SEC:
      MEET_URL:
      MEET_CLIENT_ID:
      MEET_CLIENT_SECRET:
      # Webhooks (step 10a, ADR 0020): the internal networks a webhook may reach, per tenant
      # (acme=10.20.0.0/16;beta=192.0.2.0/24; a bare CIDR list is DEFAULT_TENANT's). None by default: a domain that
      # resolves to a private address is refused at each delivery.
      WEBHOOK_PRIVATE_NETWORKS:
      # The ports a webhook URL may name (443,80 by default; 0 never).
      WEBHOOK_PORTS:
      # The platform's public addresses a webhook must never reach, even inside the networks above (its entry point,
      # services that trust this host's address); the addresses of this host's own interfaces are always refused.
      WEBHOOK_DENY_NETWORKS:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      start_period: 120s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    <<: *host
    build:
      context: ../..
      dockerfile: docker/Dockerfile.web
    image: twakephone-web:local
    environment:
      HOST: 127.0.0.1
      PORT: "8081"
      GATEWAY_URL: https://${DOMAIN}
      OIDC_AUTHORITY: "${OIDC_AUTHORITY:?OIDC_AUTHORITY is required}"
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-twakephone-web}
      OIDC_SCOPE:
      # Passed only when .env sets it (even empty): unset, the app asks for consent when the scope has offline_access.
      OIDC_PROMPT:
      OIDC_RESOURCE:
      HSTS_MAX_AGE:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/config.json').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 3

  # ---- demo profile: an identity provider and a directory with three test people (README, "Démo") ----
  keycloak:
    profiles: ["demo"]
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    <<: *logging
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # Read by the realm file (demo/twakephone-realm.json) when it is imported, at the first start only.
      DOMAIN: ${DOMAIN}
      ALICE_PASSWORD: ${ALICE_PASSWORD:-}
      BOB_PASSWORD: ${BOB_PASSWORD:-}
      CAROLE_PASSWORD: ${CAROLE_PASSWORD:-}
    volumes:
      - ./demo/twakephone-realm.json:/opt/keycloak/data/import/twakephone-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # No curl in the image: bash sends one HTTP/1.0 request to the management port, 200 or unhealthy.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && case \"$$status\" in *' 200 '*) exit 0 ;; *) exit 1 ;; esac"]
      interval: 5s
      timeout: 5s
      retries: 40

  openldap:
    profiles: ["demo"]
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    restart: unless-stopped
    <<: *logging
    ports:
      - "127.0.0.1:3890:389"
    environment:
      LDAP_ORGANISATION: TwakePhone demo
      LDAP_DOMAIN: twakephone.demo
      LDAP_ADMIN_PASSWORD:
      # The Gateway binds with this read-only account (LDAP_BIND_DN=cn=readonly,dc=twakephone,dc=demo).
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: readonly
      LDAP_READONLY_USER_PASSWORD: ${LDAP_READONLY_PASSWORD:-}
      LDAP_TLS: "false"
    volumes:
      - ./demo/people.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-people.ldif:ro
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -b dc=twakephone,dc=demo -D cn=readonly,dc=twakephone,dc=demo -w \"$$LDAP_READONLY_USER_PASSWORD\" '(uid=alice)' uid | grep -q '^uid: alice'"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  keycloak-data:
  openldap-data:
  openldap-config:
