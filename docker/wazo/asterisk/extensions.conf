; The dialplan of the development and CI stack (ADR 0022), in place of Wazo's extensions.d/01-wazo.conf: only the
; calls OpenSIPS sends to a person's mailbox (step 11a) and to a call flow (step 11c-2: a call with X-Twake-Flow, which
; OpenSIPS alone writes, goes to extensions-flows.conf). Wazo's own dialplan (users, groups, queues, IVR, wazo-agid) is
; not run by this stack: it needs wazo-agid, and the lines of the people have no user (ADR 0027).
;
; The mailbox comes in X-Twake-Mailbox (number@context, what the Gateway wrote for the extension dialled; OpenSIPS reads
; it with the rules of that extension, and removes any a caller sent), the greeting in X-Twake-Voicemail: "busy" (the
; person is busy or declined), anything else the unavailable one, then ";caller=external" for a call from outside (the
; operator). The mailbox's number is its holder's, never the extension's: it stays theirs
; whatever extension they hold. A mailbox that Wazo does not have is refused before any answer (404): OpenSIPS then
; gives the caller the failure they would have had.
;
; The greeting the person recorded, if any, is Asterisk's (VoiceMail's b or u). Else this one: "Votre correspondant",
; the extension for a caller of the platform only (never spelled out to someone outside), "n'est pas
; disponible" or "est déjà en ligne"; then the instructions and the beep. A message lasts maxsecs at most (the bound of
; each mailbox, from the Gateway), the call VOICEMAIL_MAX_CALL_SEC (TIMEOUT(absolute): Asterisk hangs up); a full
; mailbox says so (vm-mailboxfull) and takes nothing.

; Wazo's own contexts for what it plays to a call in progress (wazo-play-beep: ChanSpy in barge mode on the channel, so that both
; parties hear a Playback; wazo-calld uses it for its recording beep). Step 11d (ADR 0029) uses it for the notice a
; recording starts with.
#include /usr/share/wazo-asterisk-config/dialplan/extensions_lib_recording.conf

[twake-opensips]
exten = _[0-9]!,1,NoOp(Call of ${EXTEN})
 same = n,Set(TWAKE_FLOW=${PJSIP_HEADER(read,X-Twake-Flow)})
 same = n,GotoIf($["${TWAKE_FLOW}" != ""]?twake-flow,s,1)
 same = n,Set(TWAKE_MAILBOX=${PJSIP_HEADER(read,X-Twake-Mailbox)})
 same = n,Set(TWAKE_VOICEMAIL=${PJSIP_HEADER(read,X-Twake-Voicemail)})
 same = n,GotoIf($[${REGEX("^[0-9]{1,40}@[A-Za-z0-9_-]{1,79}$" ${TWAKE_MAILBOX})} = 0]?refuse)
 same = n,GotoIf(${VM_INFO(${TWAKE_MAILBOX},exists)}?record)
 same = n(refuse),NoOp(No mailbox ${TWAKE_MAILBOX} for ${EXTEN})
 same = n,Hangup(1)
 same = n(record),Set(CHANNEL(language)=fr_FR)
 same = n,Set(TIMEOUT(absolute)=${ENV(VOICEMAIL_MAX_CALL_SEC)})
 same = n,Set(TWAKE_BUSY=${IF($["${CUT(TWAKE_VOICEMAIL,\;,1)}" = "busy"]?1:0)})
 same = n,Set(TWAKE_EXTERNAL=${IF($["${CUT(TWAKE_VOICEMAIL,\;,2)}" = "caller=external"]?1:0)})
 same = n,Set(TWAKE_SPOOL=/var/spool/asterisk/voicemail/${CUT(TWAKE_MAILBOX,@,2)}/${CUT(TWAKE_MAILBOX,@,1)})
 same = n,GotoIf($[${STAT(e,${TWAKE_SPOOL}/${IF($[${TWAKE_BUSY} = 1]?busy:unavail)}.wav)} | ${STAT(e,${TWAKE_SPOOL}/temp.wav)}]?own)
 same = n,Answer()
 same = n,Playback(vm-theperson)
 same = n,ExecIf($[${TWAKE_EXTERNAL} = 0]?SayDigits(${EXTEN}))
 same = n,Playback(${IF($[${TWAKE_BUSY} = 1]?vm-isonphone:vm-isunavail)})
 same = n,VoiceMail(${TWAKE_MAILBOX})
 same = n,Hangup()
 same = n(own),VoiceMail(${TWAKE_MAILBOX},${IF($[${TWAKE_BUSY} = 1]?b:u)})
 same = n,Hangup()

exten = i,1,Hangup(1)

; Click-to-call (ADR 0033): the line of the person answered the Gateway's Originate; hand the call to the number it
; showed (a REFER, which OpenSIPS lets through on the Gateway's grant), and end this side 5 s later whatever Transfer
; waits for (Asterisk does not learn the outcome from the phone): the phone's call to the target is its own.
[twake-click-to-call]
exten = s,1,GotoIf($[${REGEX("^[+]?[0-9]{2,20}$" ${TWAKE_TARGET})} & ${REGEX("^[A-Za-z0-9.-]{1,253}$" ${TWAKE_DOMAIN})}]?go)
 same = n,Hangup(1)
 same = n(go),Set(TIMEOUT(absolute)=5)
 same = n,Transfer(PJSIP/sip:${TWAKE_TARGET}@${TWAKE_DOMAIN})
 same = n,Hangup()
