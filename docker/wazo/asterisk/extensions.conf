; The dialplan of the development and CI stack (ADR 0022), in place of Wazo's extensions.d/01-wazo.conf: only the
; calls OpenSIPS sends to a person's mailbox (step 11a). Wazo's own dialplan (users, groups, queues, IVR, wazo-agid)
; comes with step 11c.
;
; The mailbox comes in X-Twake-Mailbox (number@context, what the Gateway wrote for the extension dialled; OpenSIPS reads
; it with the rules of that extension), the greeting in X-Twake-Voicemail: "busy" (the person is busy or declined),
; anything else the unavailable one, then ";caller=external" for a call from outside (the operator). A mailbox that is
; not the extension called, or that Wazo does not have, is refused before any answer (404): OpenSIPS then gives the
; caller the failure they would have had.
;
; The greeting the person recorded, if any, is Asterisk's (VoiceMail's b or u). Else this one: "Votre correspondant",
; the extension for a caller of the platform only (never spelled out to someone outside: review 11a, n°12), "n'est pas
; disponible" or "est déjà en ligne"; then the instructions and the beep. A message lasts maxsecs at most (the bound of
; each mailbox, from the Gateway), the call VOICEMAIL_MAX_CALL_SEC (TIMEOUT(absolute): Asterisk hangs up); a full
; mailbox says so (vm-mailboxfull) and takes nothing.

[twake-opensips]
exten = _[0-9]!,1,NoOp(Voicemail of ${EXTEN})
 same = n,Set(TWAKE_MAILBOX=${PJSIP_HEADER(read,X-Twake-Mailbox)})
 same = n,Set(TWAKE_VOICEMAIL=${PJSIP_HEADER(read,X-Twake-Voicemail)})
 same = n,GotoIf($[${REGEX("^[0-9]{1,40}@[A-Za-z0-9_-]{1,79}$" ${TWAKE_MAILBOX})} = 0]?refuse)
 same = n,GotoIf($["${CUT(TWAKE_MAILBOX,@,1)}" != "${EXTEN}"]?refuse)
 same = n,GotoIf(${VM_INFO(${TWAKE_MAILBOX},exists)}?record)
 same = n(refuse),NoOp(No mailbox ${TWAKE_MAILBOX} for ${EXTEN})
 same = n,Hangup(1)
 same = n(record),Set(CHANNEL(language)=fr_FR)
 same = n,Set(TIMEOUT(absolute)=${ENV(VOICEMAIL_MAX_CALL_SEC)})
 same = n,Set(TWAKE_BUSY=${IF($["${CUT(TWAKE_VOICEMAIL,\;,1)}" = "busy"]?1:0)})
 same = n,Set(TWAKE_EXTERNAL=${IF($["${CUT(TWAKE_VOICEMAIL,\;,2)}" = "caller=external"]?1:0)})
 same = n,Set(TWAKE_SPOOL=/var/spool/asterisk/voicemail/${CUT(TWAKE_MAILBOX,@,2)}/${EXTEN})
 same = n,GotoIf($[${STAT(e,${TWAKE_SPOOL}/${IF($[${TWAKE_BUSY} = 1]?busy:unavail)}.wav)} | ${STAT(e,${TWAKE_SPOOL}/temp.wav)}]?own)
 same = n,Answer()
 same = n,Playback(vm-theperson)
 same = n,ExecIf($[${TWAKE_EXTERNAL} = 0]?SayDigits(${EXTEN}))
 same = n,Playback(${IF($[${TWAKE_BUSY} = 1]?vm-isonphone:vm-isunavail)})
 same = n,VoiceMail(${TWAKE_MAILBOX})
 same = n,Hangup()
 same = n(own),VoiceMail(${TWAKE_MAILBOX},${IF($[${TWAKE_BUSY} = 1]?b:u)})
 same = n,Hangup()

exten = i,1,Hangup(1)
