; The dialplan of the development and CI stack (ADR 0021), in place of Wazo's extensions.d/01-wazo.conf: only the
; calls OpenSIPS sends to a person's mailbox (step 11a). Wazo's own dialplan (users, groups, queues, IVR, wazo-agid)
; comes with step 11c.
;
; The mailbox comes in X-Twake-Mailbox (number@context, what the Gateway wrote for the extension dialled; OpenSIPS reads
; it with the rules of that extension), the greeting in X-Twake-Voicemail: "busy" (the person is busy or declined),
; anything else the unavailable one. A mailbox that is not the extension called, or that Wazo does not have, is
; refused before any answer (404): OpenSIPS then gives the caller the failure they would have had.

[twake-opensips]
exten = _[0-9].,1,NoOp(Voicemail of ${EXTEN})
 same = n,Set(TWAKE_MAILBOX=${FILTER(0-9A-Za-z@_-,${PJSIP_HEADER(read,X-Twake-Mailbox)})})
 same = n,GotoIf($["${CUT(TWAKE_MAILBOX,@,1)}" != "${EXTEN}"]?refuse)
 same = n,GotoIf($["${CUT(TWAKE_MAILBOX,@,2)}" = ""]?refuse)
 same = n,GotoIf(${VM_INFO(${TWAKE_MAILBOX},exists)}?record)
 same = n(refuse),NoOp(No mailbox ${TWAKE_MAILBOX} for ${EXTEN})
 same = n,Hangup(1)
 same = n(record),Set(CHANNEL(language)=fr_FR)
 same = n,Set(TWAKE_GREETING=u)
 same = n,ExecIf($["${PJSIP_HEADER(read,X-Twake-Voicemail)}" = "busy"]?Set(TWAKE_GREETING=b))
 same = n,VoiceMail(${TWAKE_MAILBOX},${TWAKE_GREETING})
 same = n,Hangup()

exten = i,1,Hangup(1)
