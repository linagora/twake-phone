; The call flows of the development and CI stack (step 11c-2, ADR 0028): what the dialplan of extensions.conf hands a call
; that OpenSIPS marked with X-Twake-Flow, in place of Wazo's own dialplan for groups, queues and IVR (they need
; wazo-agid, which this stack does not run). The header is written by OpenSIPS only (it removes one a phone or the
; operator sent), from `call_flows` (what the Gateway
; wrote once Wazo made the flow), and carries the route provider-wazo made, words made of letters, digits and `_.:=/~-`
; between bars:
;
;   seq|<group>|<seconds>     a sequential group: the Wazo group of that name (wazo-confd, strategy linear), its members
;                             called one after the other. The caller hears ringing, not answered until a member is.
;   queue|<group>|<seconds>   a queue: the Wazo group (strategy least_recent); the caller is answered and waits at most
;                             that many seconds for a member to be free.
;   menu|<choices>|<sound>    a voice menu (SVI): the sound plays, a digit leads to `e:<extension>` (that extension's line
;                             is called) or `q:<group>:<seconds>` (that group, as above), choices joined by `~`:
;                             1=q:twakephone-801:90~2=e:102
;
; A flow that fails (no such group, nobody answers within the time) ends with cause 19: OpenSIPS tells the caller nobody can
; be reached (480), never that the number does not exist. The members are called in [twake-members]: Wazo calls
; `Local/<extension>@twake-members` for each (wazo-confd's group members of the extensions kind), which rings the line
; of the extension (ADR 0027), so that its windows ring through OpenSIPS; an extension with no window registered fails
; at once and the next member is tried. On a Wazo installed by its packages the context of the members is Wazo's own
; (the people's lines have a user there): this stack has none (provider-wazo's membersContext).

[twake-flow]
exten = s,1,NoOp(Flow ${EXTEN})
 same = n,Set(CHANNEL(language)=fr_FR)
 same = n,Set(TWAKE_KIND=${CUT(TWAKE_FLOW,|,1)})
 same = n,GotoIf($["${TWAKE_KIND}" = "seq"]?group)
 same = n,GotoIf($["${TWAKE_KIND}" = "queue"]?group)
 same = n,GotoIf($["${TWAKE_KIND}" = "menu"]?menu)
 same = n,Hangup(19)
 same = n(group),Set(TWAKE_GROUP=${CUT(TWAKE_FLOW,|,2)})
 same = n,Set(TWAKE_WAIT=${CUT(TWAKE_FLOW,|,3)})
 same = n,GotoIf($[${REGEX("^[A-Za-z0-9_.-]{1,128}$" ${TWAKE_GROUP})} = 0]?fail)
 same = n,GotoIf($[${REGEX("^[0-9]{1,4}$" ${TWAKE_WAIT})} = 0]?fail)
 same = n,GotoIf($["${QUEUE_EXISTS(${TWAKE_GROUP})}" != "1"]?fail)
 same = n,GotoIf($["${TWAKE_KIND}" = "queue"]?waiting)
 same = n,Queue(${TWAKE_GROUP},r,,,${TWAKE_WAIT})
 same = n,Goto(fail)
 same = n(waiting),Answer()
 same = n,Queue(${TWAKE_GROUP},,,,${TWAKE_WAIT})
 same = n(fail),Hangup(19)
 same = n(menu),Answer()
 same = n,Set(TWAKE_CHOICES=${CUT(TWAKE_FLOW,|,2)})
 same = n,Set(TWAKE_GREETING=${CUT(TWAKE_FLOW,|,3)})
 same = n,Set(TWAKE_TRIES=0)
 same = n(ask),Set(TWAKE_TRIES=$[${TWAKE_TRIES} + 1])
 same = n,GotoIf($[${TWAKE_TRIES} > 3]?bye)
 same = n,Background(${TWAKE_GREETING})
 same = n,WaitExten(6)
 same = n(bye),Hangup()

; A digit: the choice it is set to, if any, else the menu asks again (three times, then it hangs up).
exten = _[0-9],1,Set(TWAKE_TARGET=)
 same = n,Set(TWAKE_I=1)
 same = n(next),Set(TWAKE_ITEM=${CUT(TWAKE_CHOICES,~,${TWAKE_I})})
 same = n,GotoIf($["${TWAKE_ITEM}" = ""]?s,ask)
 same = n,GotoIf($["${CUT(TWAKE_ITEM,=,1)}" = "${EXTEN}"]?found)
 same = n,Set(TWAKE_I=$[${TWAKE_I} + 1])
 same = n,Goto(next)
 same = n(found),Set(TWAKE_TARGET=${CUT(TWAKE_ITEM,=,2)})
 same = n,GotoIf($["${CUT(TWAKE_TARGET,:,1)}" = "q"]?queue)
 same = n,GotoIf($["${CUT(TWAKE_TARGET,:,1)}" = "e"]?extension)
 same = n,Goto(s,ask)
 same = n(queue),Set(TWAKE_GROUP=${CUT(TWAKE_TARGET,:,2)})
 same = n,Set(TWAKE_WAIT=${CUT(TWAKE_TARGET,:,3)})
 same = n,GotoIf($[${REGEX("^[A-Za-z0-9_.-]{1,128}$" ${TWAKE_GROUP})} = 0]?s,ask)
 same = n,GotoIf($[${REGEX("^[0-9]{1,4}$" ${TWAKE_WAIT})} = 0]?s,ask)
 same = n,GotoIf($["${QUEUE_EXISTS(${TWAKE_GROUP})}" != "1"]?s,ask)
 same = n,Queue(${TWAKE_GROUP},,,,${TWAKE_WAIT})
 same = n,Hangup()
 same = n(extension),Set(TWAKE_EXT=${CUT(TWAKE_TARGET,:,2)})
 same = n,GotoIf($[${REGEX("^[0-9]{1,40}$" ${TWAKE_EXT})} = 0]?s,ask)
 same = n,Dial(PJSIP/${TWAKE_EXT},30)
 same = n,Hangup()

; Nothing typed in time, or a key that is no digit: asked again.
exten = t,1,Goto(s,ask)
exten = i,1,Goto(s,ask)

; The members of a sequential group or a queue: the line of the extension.
[twake-members]
exten = _[0-9]!,1,Dial(PJSIP/${EXTEN},90)
 same = n,Hangup()
