# wazo-auth for the development and CI stack (docker-compose.sip.yml, ADR 0021): on the loopback, Wazo's database and
# bus of this stack. Its first user (`bootstrap_user_*`, every right) is what wazo-bootstrap makes the service accounts
# with; development values only, as the database's.
debug: false
log_level: info
rest_api:
  listen: 127.0.0.1
  port: 9497
db_uri: postgresql://asterisk:proformatique@127.0.0.1:54330/asterisk?application_name=wazo-auth
amqp:
  uri: amqp://guest:guest@127.0.0.1:5672/
service_discovery:
  enabled: false
bootstrap_user_on_startup: true
bootstrap_user_username: twake-bootstrap
bootstrap_user_password: twake-wazo-dev-only
