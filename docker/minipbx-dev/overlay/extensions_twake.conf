; Twake: ring every registered window of an extension.
; An ARI originate (or a plain Dial) to PJSIP/<ext> reaches ONE contact only; PJSIP_DIAL_CONTACTS reaches all.
; Used by the Gateway through Local/<ext>@twake-ring/n. Honours the do-not-disturb device state.
[twake-ring]
exten => _X.,1,NoOp(Twake ring ${EXTEN})
 same => n,GotoIf($["${DEVICE_STATE(Stasis:dnd${EXTEN})}"="BUSY"]?busy)
 same => n,Dial(${PJSIP_DIAL_CONTACTS(${EXTEN})},30)
 same => n,Hangup()
 same => n(busy),Busy(5)

; Meet dial-out: LiveKit SIP calls the PBX with the number to reach; the PBX's own rules (extensions, trunks) apply.
[livekit-in]
exten => _X.,1,NoOp(Meet dial-out ${EXTEN})
 same => n,Goto(minipbx-internal,${EXTEN},1)
exten => _+X.,1,Goto(minipbx-internal,${EXTEN},1)

; Test callee for Meet dial-out (smoke tests): answers and stays on the line.
[minipbx-internal]
exten => 8888,1,Answer()
 same => n,Wait(60)
 same => n,Hangup()

; Meet dial-in: internal users dial 8000 and type the meeting PIN (LiveKit dispatch rule).
[minipbx-internal]
exten => 8000,1,NoOp(Meet dial-in)
 same => n,Dial(PJSIP/8000@livekit,60)
 same => n,Hangup()
