; Twake: LiveKit SIP trunk (Meet dial-in/out). Matched by source IP, no registration.
[livekit]
type=endpoint
transport=transport-udp
context=livekit-in
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
aors=livekit
identify_by=ip

[livekit]
type=aor
contact=sip:172.27.0.60:5070

[livekit]
type=identify
endpoint=livekit
match=172.27.0.60
