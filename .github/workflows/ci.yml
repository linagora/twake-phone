name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-and-packages:
    name: Paquets et passerelle (Node 22, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: twake
          POSTGRES_PASSWORD: twake
          POSTGRES_DB: twake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            apps/phone/yarn.lock
      - run: yarn install --frozen-lockfile
      # cozy-client et cozy-interapp sont des peer deps de phone-link, installées avec l'app :
      # vitest.config.ts les résout dans apps/phone/node_modules (engines 24.x, d'où --ignore-engines).
      - run: yarn --cwd apps/phone install --frozen-lockfile --ignore-engines
      - run: yarn build
      - run: yarn typecheck
      - name: Tests unitaires et contrat de stockage (mémoire et PostgreSQL)
        run: yarn test
        env:
          TEST_DATABASE_URL: postgres://twake:twake@localhost:5432/twake_test
      - name: Cache de Chromium (clé = version de playwright-core)
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Chromium pour l'e2e de l'app web
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      - name: Dépendances système de Chromium (cache ou non)
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - name: e2e app web (OIDC, passerelle et navigateur en local, sans Docker)
        run: node apps/web/test/web.e2e.mjs
      - name: Capture d'écran de l'e2e en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-failure
          path: apps/web/dist/e2e-failure.png
          if-no-files-found: ignore

  app-phone:
    name: App Phone (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            apps/phone/yarn.lock
      # L'app résout @twake/* vers packages/*/dist (jest.config.js, rsbuild.config.mjs) :
      # il faut installer et construire la racine d'abord.
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn install --frozen-lockfile
        working-directory: apps/phone
      - run: yarn lint
        working-directory: apps/phone
      - run: yarn test
        working-directory: apps/phone
      - run: yarn build
        working-directory: apps/phone

  sip-e2e:
    name: SIP (OpenSIPS, rtpengine, deux navigateurs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            apps/phone/yarn.lock
      # La stack SIP se construit pendant que le dépôt s'installe : OpenSIPS 3.6 (image officielle + modules WSS,
      # TLS, PostgreSQL), rtpengine en espace utilisateur, PostgreSQL avec la table `subscriber`. Réseau hôte.
      - name: Stack SIP (Docker Compose)
        run: docker compose -f docker/docker-compose.sip.yml up --build --wait --wait-timeout 300
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd apps/phone install --frozen-lockfile --ignore-engines
      - run: yarn build
      - name: Cache de Chromium (clé = version de playwright-core)
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      - name: Dépendances système de Chromium (cache ou non)
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - name: e2e SIP (deux navigateurs, micro simulé, OpenSIPS et rtpengine en Docker)
        run: node apps/web/test/sip.e2e.mjs
        env:
          SIP_WSS_URL: wss://127.0.0.1:8089
          OPENSIPS_DB_URL: postgres://twake:twake@127.0.0.1:54320/twake
      - name: Journaux de la stack SIP en cas d'échec
        if: failure()
        run: docker compose -f docker/docker-compose.sip.yml logs --no-color --timestamps | tail -n 400
      - name: Captures d'écran de l'e2e en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sip-failure
          path: apps/web/dist/sip-e2e-failure-*.png
          if-no-files-found: ignore
      - name: Arrêt de la stack SIP
        if: always()
        run: docker compose -f docker/docker-compose.sip.yml down -v

  # yarn e2e:web et yarn e2e:sip tournent ci-dessus. Les e2e du POC sur sa stack (yarn e2e:live, yarn e2e:widget,
  # platform.e2e.mjs) demandent MiniPBX, LiveKit et la stack Twake : ils ne sont plus joués et partent avec le POC
  # (étape 3c). Les e2e à trois navigateurs (transferts) arrivent avec la PR 3b.
