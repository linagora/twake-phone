name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-and-packages:
    name: Paquets et passerelle (Node 22, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: twake
          POSTGRES_PASSWORD: twake
          POSTGRES_DB: twake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - id: build
        run: yarn build
      - run: yarn typecheck
      # ESLint sur tout le monorepo (eslint.config.mjs), après le build (l'app web et les specs lisent les dist/*.d.ts
      # des paquets) et même si le typecheck a échoué : les deux verdicts en un seul passage.
      - name: Lint (ESLint)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: yarn lint
      # Les tests tournent et rendent leur verdict même si le typecheck ou le lint ont échoué.
      - name: Tests unitaires et contrat de stockage (mémoire et PostgreSQL)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: yarn test
        env:
          TEST_DATABASE_URL: postgres://twake:twake@localhost:5432/twake_test
      - name: Cache de Chromium (clé = version de playwright-core)
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Chromium pour l'e2e de l'app web
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      - name: Dépendances système de Chromium (cache ou non)
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - name: e2e app web (OIDC, passerelle et navigateur en local, sans Docker)
        run: node apps/web/test/web.e2e.mjs
      - name: Capture d'écran de l'e2e en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-failure
          path: apps/web/dist/e2e-failure.png
          if-no-files-found: ignore

  sip-e2e:
    name: SIP (OpenSIPS, rtpengine, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, msedge]
    # OpenSIPS annonce au trunk une adresse de documentation (TEST-NET-1), comme derrière un NAT : l'opérateur simulé
    # la reçoit (enregistrement, Via, Record-Route) et la ramène vers la socket du trunk (docker-compose.sip.yml, e2e).
    # Le téléphone d'un appel avec l'opérateur est interrogé (OPTIONS dans l'appel) toutes les 5 s plutôt que 30 : un
    # téléphone parti met fin à l'appel en quelques secondes (e2e). L'appel le plus court que les minutes restantes
    # permettent : 5 s plutôt que 60, pour qu'un plafond de minutes coupe un appel en quelques secondes (trunk.sip.mjs).
    # Les essais de PIN ratés d'une salle (étape 8) : 3 par appelant (refusé au-delà) et 6 pour tous en 10 minutes
    # (l'alerte des administrateurs, le plafond de ceux qui masquent leur numéro) plutôt que 10 et 300, pour que
    # trunk.sip.mjs et l'e2e les jouent en quelques appels.
    env:
      TRUNK_ADVERTISE: 192.0.2.10:5070
      CALL_PING_SEC: "5"
      TRUNK_MIN_CALL_SEC: "5"
      MEET_PIN_TRIES: "3"
      MEET_PIN_TRIES_ALL: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      # La stack SIP d'abord (`--wait` bloque jusqu'aux healthchecks) : OpenSIPS 3.6 (image officielle + modules
      # WSS, TLS, PostgreSQL), rtpengine en espace utilisateur, PostgreSQL avec la table `subscriber`. Réseau hôte.
      - name: Stack SIP (Docker Compose)
        run: docker compose -f docker/docker-compose.sip.yml up --build --wait --wait-timeout 300
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Cache du navigateur Playwright (clé = navigateur et version de playwright-core)
        if: matrix.browser != 'msedge'
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Navigateur Playwright
        if: matrix.browser != 'msedge' && steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - name: Dépendances système du navigateur (cache ou non)
        if: matrix.browser != 'msedge' && steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps ${{ matrix.browser }}
      # Firefox n'a pas de sortie audio simulée : sans périphérique de sortie, son AudioContext ne démarre jamais
      # (la sonnerie reste « bloquée »). Un serveur PulseAudio avec un puits nul lui en donne une.
      - name: Sortie audio pour Firefox (PulseAudio, puits nul)
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=twakephone sink_properties=device.description=TwakePhone
          pactl info | head -5
      # Edge est préinstallé sur ubuntu-latest (la version suit l'image du runner, le script l'affiche) ; sinon
      # Playwright l'installe par le dépôt Microsoft.
      - name: Microsoft Edge
        if: matrix.browser == 'msedge'
        run: microsoft-edge --version || npx playwright-core install msedge
      # Le trunk tel que le script d'OpenSIPS le traite, sans navigateur (téléphones SIP et opérateurs simulés en
      # Node) : une fois, il ne dépend d'aucun navigateur.
      # OpenSIPS y est tué (SIGKILL) puis relancé pendant des appels : ils doivent survivre (revue 6b, n°5).
      - name: Trunk SIP (téléphones et opérateurs simulés, sans navigateur)
        if: matrix.browser == 'chromium'
        run: node apps/web/test/trunk.sip.mjs
        env:
          OPENSIPS_DB_URL: postgres://twake:twake@127.0.0.1:54320/twake
          OPENSIPS_RESTART: docker compose -f docker/docker-compose.sip.yml kill -s KILL opensips && docker compose -f docker/docker-compose.sip.yml up -d --wait --wait-timeout 120 opensips
      - name: e2e SIP (trois personnes dans ${{ matrix.browser }}, micro simulé, OpenSIPS et rtpengine en Docker)
        run: node apps/web/test/sip.e2e.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          SIP_WSS_URL: wss://127.0.0.1:8089
          OPENSIPS_DB_URL: postgres://twake:twake@127.0.0.1:54320/twake
      # Service par service (étape 8 : LiveKit et LiveKit SIP écrivent beaucoup), la fin de chacun.
      - name: Journaux de la stack SIP en cas d'échec
        if: failure()
        run: |
          for service in opensips rtpengine livekit-sip livekit; do
            echo "::group::$service"
            docker compose -f docker/docker-compose.sip.yml logs --no-color --timestamps --tail 300 "$service"
            echo "::endgroup::"
          done
      - name: Captures d'écran de l'e2e en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sip-failure-${{ matrix.browser }}
          path: apps/web/dist/sip-e2e-failure-*.png
          if-no-files-found: ignore
      - name: Arrêt de la stack SIP
        if: always()
        run: docker compose -f docker/docker-compose.sip.yml down -v

  pilot:
    name: Kit pilote (images Docker, Caddy, Keycloak, LDAP, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      # Le kit tel qu'un pilote le lance (docker/pilot/README.md), profil demo, avec un nom de test résolu en local
      # (OpenSIPS le résout à son démarrage) et le certificat de l'autorité interne de Caddy. Le son reste sur la boucle.
      - name: .env du kit (init.sh, profil demo)
        run: |
          echo "127.0.0.1 twakephone.test" | sudo tee -a /etc/hosts
          docker/pilot/init.sh twakephone.test internal --demo --media-ip 127.0.0.1
          sudo ss -Hlntup | awk '{print $1, $5, $7}' | sort -u > "$RUNNER_TEMP/listen-before"
      - name: Kit pilote (construction des images et démarrage)
        working-directory: docker/pilot
        run: docker compose up --build --wait --wait-timeout 600
      # ADR 0012 : hors de la boucle, le kit n'ouvre que 80 et 443 (Caddy) et la plage RTP de rtpengine. Sauf les
      # sockets d'envoi d'event_datagram (OpenSIPS) : le module ne les lie pas, le noyau leur donne au premier
      # événement envoyé un port éphémère sur toutes les adresses ; OpenSIPS n'y lit jamais rien (docker/pilot/README.md).
      # Depuis l'étape 5, la passerelle lève un événement dès son abonnement (E_TWAKEPHONE_PROBE) : il y en a déjà un ici.
      - name: Le kit n'écoute hors de la boucle que sur 80, 443 et la plage RTP
        run: |
          sudo ss -Hlntup | awk '{print $1, $5, $7}' | sort -u > "$RUNNER_TEMP/listen-after"
          comm -13 "$RUNNER_TEMP/listen-before" "$RUNNER_TEMP/listen-after" | tee "$RUNNER_TEMP/listen-new"
          read -r eph_lo eph_hi < /proc/sys/net/ipv4/ip_local_port_range
          exposed=$(awk -v lo="$eph_lo" -v hi="$eph_hi" '{ addr = $2; port = addr; sub(/.*:/, "", port); sub(/:[^:]*$/, "", addr)
                           if (addr ~ /^(127\.|\[::1\]$)/) next
                           if (port == 80 || port == 443 || ($1 == "udp" && port >= 30000 && port <= 30999)) next
                           if ($1 == "udp" && (addr == "0.0.0.0" || addr == "*") && port + 0 >= lo + 0 && port + 0 <= hi + 0 && $3 ~ /^users:\(\("opensips",/) next
                           print }' "$RUNNER_TEMP/listen-new")
          if [ -n "$exposed" ]; then echo "Exposed beyond the loopback:"; echo "$exposed"; exit 1; fi
      - run: yarn install --frozen-lockfile
      - name: Cache de Chromium (clé = version de playwright-core)
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      - name: Dépendances système de Chromium (cache ou non)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - name: e2e du kit pilote (connexion Keycloak, annuaire LDAP, appel entre deux navigateurs, Récents)
        run: |
          export ALICE_PASSWORD=$(sed -n 's/^ALICE_PASSWORD=//p' docker/pilot/.env) BOB_PASSWORD=$(sed -n 's/^BOB_PASSWORD=//p' docker/pilot/.env)
          node apps/web/test/pilot.e2e.mjs
        env:
          PILOT_URL: https://twakephone.test
          PILOT_RESOLVE: 127.0.0.1
          PILOT_INSECURE: '1'
      # Un second démarrage sur les mêmes volumes (royaume déjà importé, base et annuaire déjà là), comme après un
      # redémarrage de la machine.
      - name: Arrêt et second démarrage du kit, e2e rejoué
        run: |
          (cd docker/pilot && docker compose down && docker compose up --wait --wait-timeout 600)
          export ALICE_PASSWORD=$(sed -n 's/^ALICE_PASSWORD=//p' docker/pilot/.env) BOB_PASSWORD=$(sed -n 's/^BOB_PASSWORD=//p' docker/pilot/.env)
          node apps/web/test/pilot.e2e.mjs
        env:
          PILOT_URL: https://twakephone.test
          PILOT_RESOLVE: 127.0.0.1
          PILOT_INSECURE: '1'
      - name: Journaux du kit en cas d'échec
        if: failure()
        working-directory: docker/pilot
        run: docker compose logs --no-color --timestamps | tail -n 400
      - name: Arrêt du kit
        if: always()
        working-directory: docker/pilot
        run: docker compose down -v

  # yarn e2e:web, yarn e2e:sip et yarn e2e:pilot tournent ci-dessus : tous les e2e du dépôt se jouent en CI.
